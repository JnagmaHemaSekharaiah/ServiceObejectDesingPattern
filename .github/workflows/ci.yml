
name: PetStore API Automation CI

# Workflow triggers
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Step 2: Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Verify Java and Maven
      - name: Check Java Version
        run: java -version

      - name: Check Maven Version
        run: mvn -version

      # Step 4: Build and Execute TestNG Tests
      - name: Run API Automation Tests
        run: mvn clean test

      # Step 5: Upload TestNG Reports
      - name: Upload TestNG Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TestNG-Reports
          path: |
            target/surefire-reports/
          if-no-files-found: warn
